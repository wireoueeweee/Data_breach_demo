spring:
  datasource:
    url: jdbc:h2:mem:breachdemo;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
  # Browse the seeded data at http://localhost:8080/h2-console
  # (JDBC URL: jdbc:h2:mem:breachdemo, user: sa, no password)
  h2:
    console:
      enabled: true
      path: /h2-console

# Number of fake customer records to generate on startup.
app:
  seed:
    count: 10000

server:
  port: 8080
